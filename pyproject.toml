[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ethos-gate"
version = "0.1.0"
description = "Application-layer safety hooks for governing agentic Claude systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["claude", "ai-safety", "agents", "hooks", "llm", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3"]

[project.urls]
Homepage = "https://github.com/ai-foundry-byu/ethos-gate"
Repository = "https://github.com/ai-foundry-byu/ethos-gate"
Issues = "https://github.com/ai-foundry-byu/ethos-gate/issues"

[project.scripts]
ethos-trifecta = "ethos_gate.audit.trifecta:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ethos_gate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
